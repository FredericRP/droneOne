# WebGL build of the Unity project with GameCI, automatic screenshots
# and publication of the playable build on GitHub Pages.
# Required secrets: UNITY_LICENSE (content of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
name: WebGL

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [Assets/**, Packages/**, ProjectSettings/**, .github/**]
  pull_request:
    paths: [Assets/**, Packages/**, ProjectSettings/**, .github/**]

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match ProjectSettings/ProjectVersion.txt (GameCI image unityci/editor:ubuntu-<version>-webgl-3).
  UNITY_VERSION: 2023.2.8f1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-${{ env.UNITY_VERSION }}-

      - name: CI WebGL settings
        run: |
          mkdir -p Assets/Editor && cp .github/webgl/CIWebGLSettings.cs Assets/Editor/
          # The pinned Standard Assets submodule has Editor asmdefs without platform filter, which breaks
          # player builds (fixed upstream since): restrict every asmdef under an Editor folder to the editor.
          find Assets -path '*/Editor/*.asmdef' -print0 | xargs -0 -r node -e '
            const fs = require("fs");
            for (const file of process.argv.slice(1)) {
              const asmdef = JSON.parse(fs.readFileSync(file, "utf8").replace(/^\uFEFF/, ""));
              if ((asmdef.includePlatforms ?? []).length) continue;
              asmdef.includePlatforms = ["Editor"];
              fs.writeFileSync(file, JSON.stringify(asmdef, null, 4));
              console.log("editor only:", file);
            }'

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildName: web
          allowDirtyBuild: true

      - name: Screenshots
        run: |
          sudo chown -R "$USER" build
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node .github/scripts/captures.mjs build/WebGL/web captures
          cp -r captures build/WebGL/web/captures

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures

      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/web

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
